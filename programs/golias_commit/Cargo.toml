[package]
name = "golias_commit"
version = "0.1.0"
description = "Gorila: Proof of Sweat — compromisso semanal com stake em SKR"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "golias_commit"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["associated_token", "token", "token_2022"] }
